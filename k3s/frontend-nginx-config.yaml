apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: kilo-guardian
data:
  default.conf: |
    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Serve the React app
        root /usr/share/nginx/html/app;
        index index.html;

        # Allow large file uploads
        client_max_body_size 20M;

        # Enable gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Serve static files
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Marketing page (optional, keeping it just in case)
        location /marketing {
            alias /usr/share/nginx/html/marketing;
            index index.html;
        }

        # Proxy Socket.IO requests to dedicated Socket.IO service
        location /api/socket.io/ {
            proxy_pass http://kilo-socketio:9010/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Proxy all other API requests to gateway (STRIPPING /api/ prefix)
        location /api/ {
            proxy_pass http://kilo-gateway:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
        }

        # Disable caching for JS/CSS
        location ~* \.(js|css)$ {
            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # Cache images and fonts
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
