---
# ServiceAccount for AI Brain
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kilo-ai-brain
  namespace: kilo-guardian
---
# 😈 THE GREMLIN ROLE: Full Cluster Control
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kilo-gremlin-master
rules:
  # Allow EVERYTHING on EVERYTHING.
  # "I can touch the shiny buttons now?" - Kilo
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
# Bind the Gremlin Power to the Brain
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kilo-ai-brain-gremlin-binding
subjects:
  - kind: ServiceAccount
    name: kilo-ai-brain
    namespace: kilo-guardian
roleRef:
  kind: ClusterRole
  name: kilo-gremlin-master
  apiGroup: rbac.authorization.k8s.io